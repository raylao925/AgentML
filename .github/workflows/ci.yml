name: agentml-ci

# Anti-drift + guardrails + smoke. See references/09_guardrails.md.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install minimal deps
        run: |
          python -m pip install --upgrade pip
          pip install "numpy>=1.24" "pandas>=2.0" "scikit-learn>=1.3" \
                      "lightgbm>=4.0" "pyarrow>=15.0" "PyYAML>=6.0" "joblib>=1.3"

      - name: SSoT check (structure / anti-drift)
        run: python .agents/skills/agentml/scripts/check_ssot.py

      - name: Guardrails (template payload)
        run: python .agents/skills/agentml/scripts/guardrails.py --payload

      - name: Smoke test (train -> evaluate -> ensemble)
        run: python -m unittest discover -s tests -v